<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmorolex Watches — Admin</title>
<style>
body{font-family:Inter,Arial,sans-serif;background:#f5f3ef;color:#201d19;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-family:Georgia,serif;margin:0}button{cursor:pointer;border:0;padding:11px 16px;border-radius:4px;background:#b88a3b;color:white;font-weight:700}button.secondary{background:#333}button.danger{background:#a33}.card{background:white;border:1px solid #ddd8cf;border-radius:8px;padding:22px;margin-bottom:20px;box-shadow:0 3px 15px #0000000a}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfc8bd;border-radius:4px;margin:6px 0 14px}label{font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.product{border:1px solid #ddd8cf;border-radius:7px;padding:14px}.product img{width:100%;height:170px;object-fit:contain;background:#fafafa}.product h3{margin:10px 0 5px}.muted{color:#756f66;font-size:13px}.hidden{display:none}.notice{padding:10px;background:#f0e6d1;border-radius:4px;margin-bottom:15px}@media(max-width:700px){.grid{grid-template-columns:1fr}header{gap:10px;align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Cosmorolex Watches Admin</h1><div class="muted">Manage products and product photos</div></div><div><a href="/" style="margin-right:12px">View Store</a><button id="logout" class="secondary">Log out</button></div></header>
<section id="loginCard" class="card">
<h2>Admin login</h2><p class="muted">Default development credentials: admin / change-this-password. Set ADMIN_USER and ADMIN_PASSWORD in production.</p>
<form id="loginForm"><label>Username</label><input id="user" value="admin" required><label>Password</label><input id="password" type="password" value="change-this-password" required><button>Sign in</button></form>
<p id="loginError" style="color:#a33"></p>
</section>
<section id="panel" class="hidden">
<div class="card"><h2>Add or upload a product</h2><form id="productForm">
<div class="grid"><div><label>Product name</label><input name="name" required></div><div><label>Brand</label><input name="brand" value="Cosmorolex"></div><div><label>Category</label><input name="category" value="Watches"></div><div><label>Reference</label><input name="ref"></div><div><label>Price (USD)</label><input name="price" type="number" step="0.01" required></div><div><label>Stock</label><input name="stock" type="number" value="1" min="0"></div></div>
<label>Description</label><textarea name="description" rows="3"></textarea><label>Product photos (up to 8 images)</label><input name="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple required><label><input name="featured" type="checkbox" value="true" style="width:auto"> Featured product</label><br><button>Add product</button></form><p id="formMessage"></p></div>
<div class="card"><h2>Current products</h2><div id="products" class="products"></div></div>
</section>
</div>
<script>
let token=localStorage.getItem("cosmoAdminToken")||"";
const $=s=>document.querySelector(s);
function authHeaders(){return token?{Authorization:"Bearer "+token}:{}}
function showPanel(){ $("#loginCard").classList.toggle("hidden",!!token); $("#panel").classList.toggle("hidden",!token); if(token) loadProducts(); }
async function login(e){e.preventDefault();const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:$("#user").value,password:$("#password").value})});const d=await r.json();if(!r.ok){$("#loginError").textContent=d.error||"Login failed";return}token=d.token;localStorage.setItem("cosmoAdminToken",token);showPanel()}
async function loadProducts(){const r=await fetch("/api/products");const list=await r.json();$("#products").innerHTML=list.length?list.map(p=>`<article class="product"><img src="${p.images&&p.images[0]||'/assets/cosmorolex-logo-icon.png'}" alt=""><h3>${p.name}</h3><div>${p.brand||""} · $${Number(p.price||0).toLocaleString()}</div><div class="muted">Stock: ${p.stock??0}</div><br><button class="danger" onclick="removeProduct('${p.id}')">Delete</button></article>`).join(""):"<p class='muted'>No uploaded products yet.</p>"}
async function submitProduct(e){e.preventDefault();const form=new FormData(e.target);if(e.target.featured.checked)form.set("featured","true");const r=await fetch("/api/admin/products",{method:"POST",headers:authHeaders(),body:form});const d=await r.json();$("#formMessage").textContent=r.ok?"Product added successfully.":(d.error||"Upload failed");if(r.ok){e.target.reset();loadProducts()}}
async function removeProduct(id){if(!confirm("Delete this product and its images?"))return;const r=await fetch("/api/admin/products/"+id,{method:"DELETE",headers:authHeaders()});if(r.status===401){token="";localStorage.removeItem("cosmoAdminToken");showPanel();return}loadProducts()}
$("#loginForm").addEventListener("submit",login);$("#productForm").addEventListener("submit",submitProduct);$("#logout").addEventListener("click",()=>{token="";localStorage.removeItem("cosmoAdminToken");showPanel()});showPanel();
</script>
</body>
</html>

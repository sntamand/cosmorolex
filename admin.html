<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmorolex Admin</title><style>body{font-family:Arial;max-width:950px;margin:auto;padding:25px;background:#f5f3ef}section{background:white;padding:20px;margin:15px 0;border-radius:8px}input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px}button{padding:10px 15px;background:#b88a3b;color:white;border:0;border-radius:4px;cursor:pointer}.hidden{display:none}.danger{background:#a33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><p><a href="index.html">← View Store</a></p><h1>Cosmorolex Watches Admin</h1><section id="login"><h2>Admin Access</h2><input id="key" type="password" placeholder="Admin key"><button onclick="login()">Sign in</button><p id="err"></p></section><section id="panel" class="hidden"><button onclick="logout()">Log out</button><h2>Add Product</h2><form id="form"><div class="grid"><label>Name<input name="name" required></label><label>Brand<input name="brand" required></label><label>Reference<input name="ref"></label><label>Price<input name="price" type="number" step=".01" required></label><label>Stock<input name="stock" type="number" value="1"></label><label>Image<input name="image" type="file" accept="image/*"></label></div><label>Description<textarea name="description"></textarea><button>Add Product</button></form><p id="msg"></p><h2>Draft Products</h2><div id="list"></div></section><script>const ADMIN_KEY="cosmo-admin-2026-change-me";let key=localStorage.getItem("cosmoAdminKey")||"",products=[];function $(x){return document.getElementById(x)}function login(){if($("key").value===ADMIN_KEY){key=$("key").value;localStorage.setItem("cosmoAdminKey",key);show()}else $("err").textContent="Incorrect key."}function logout(){key="";localStorage.removeItem("cosmoAdminKey");show()}function show(){$("login").classList.toggle("hidden",!!key);$("panel").classList.toggle("hidden",!key);if(key)load()}async function load(){let saved=localStorage.getItem("cosmoProductsDraft");products=saved?JSON.parse(saved):await (await fetch("products.json")).json();render()}function render(){$("list").innerHTML=products.map((p,i)=>`<div><b>${p.name}</b> — $${Number(p.price).toLocaleString()} <button class="danger" onclick="products.splice(${i},1);save();render()">Delete</button></div>`).join("")}function save(){localStorage.setItem("cosmoProductsDraft",JSON.stringify(products))}$("form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get("image"),image="";if(file&&file.size)image=await new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(file)});products.push({id:Date.now().toString(),name:f.get("name"),brand:f.get("brand"),ref:f.get("ref"),price:Number(f.get("price")),stock:Number(f.get("stock")),description:f.get("description"),images:image?[image]:[]});save();render();$("msg").textContent="Saved as a browser draft. Publish by updating products.json in GitHub.";e.target.reset()};show()</script></body></html>

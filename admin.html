<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmorolex Automatic Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:1050px;margin:auto;padding:24px;background:#f5f3ef;color:#222}
section{background:#fff;padding:22px;margin:16px 0;border-radius:10px;box-shadow:0 2px 12px #0000000d}
input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 13px;border:1px solid #ccc;border-radius:5px}
button{padding:11px 16px;background:#b88a3b;color:#fff;border:0;border-radius:5px;cursor:pointer}
button.danger{background:#a33}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.item{display:flex;gap:15px;align-items:center;border-top:1px solid #ddd;padding:14px 0}.item img{width:75px;height:75px;object-fit:cover;border-radius:5px}
.status{padding:10px;background:#f1eadc;border-radius:5px;margin-top:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<p><a href="index.html">← View live store</a></p>
<h1>Cosmorolex Automatic Admin</h1>

<section id="loginBox">
<h2>Admin login</h2>
<p>Use the email and password created in Supabase Authentication.</p>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Sign in</button><p id="loginMsg"></p>
</section>

<section id="panel" class="hidden">
<button onclick="logout()">Log out</button>
<h2>Publish a product</h2>
<form id="productForm">
<div class="grid">
<label>Name<input name="name" required></label>
<label>Brand<input name="brand" required></label>
<label>Reference<input name="reference"></label>
<label>Price<input name="price" type="number" step="0.01" required></label>
<label>Stock<input name="stock" type="number" min="0" value="1" required></label>
<label>Image<input name="image" type="file" accept="image/*" required></label>
</div>
<label>Description<textarea name="description"></textarea></label>
<label><input name="published" type="checkbox" checked style="width:auto"> Publish immediately</label><br>
<button type="submit">Upload and publish automatically</button>
<div id="status" class="status"></div>
</form>
<h2>Current products</h2><div id="list"></div>
</section>

<script>
const client = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

async function login(){
  const {error}=await client.auth.signInWithPassword({email:$("email").value,password:$("password").value});
  $("loginMsg").textContent=error?error.message:"";
  if(!error) show();
}
async function logout(){await client.auth.signOut();show()}
async function show(){
  const {data:{session}}=await client.auth.getSession();
  $("loginBox").classList.toggle("hidden",!!session);
  $("panel").classList.toggle("hidden",!session);
  if(session) loadProducts();
}
async function loadProducts(){
  const {data,error}=await client.from("products").select("*").order("created_at",{ascending:false});
  if(error){$("list").textContent=error.message;return}
  $("list").innerHTML=(data||[]).map(p=>`
    <div class="item">
      <img src="${p.image_url||'cosmorolex-logo-icon.png'}">
      <div style="flex:1"><b>${esc(p.name)}</b><br>${esc(p.brand||'')} — $${Number(p.price).toLocaleString()}<br>
      Status: ${p.published?'Live':'Hidden'} | Stock: ${p.stock}</div>
      <button class="danger" onclick="removeProduct('${p.id}')">Delete</button>
    </div>`).join("") || "No products yet.";
}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function uploadImage(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${crypto.randomUUID()}.${ext}`;
  const {error}=await client.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type});
  if(error) throw error;
  const {data}=client.storage.from("product-images").getPublicUrl(path);
  return data.publicUrl;
}
$("productForm").onsubmit=async e=>{
  e.preventDefault(); $("status").textContent="Uploading image and saving product...";
  try{
    const f=new FormData(e.target), file=f.get("image"), image_url=await uploadImage(file);
    const {error}=await client.from("products").insert({
      name:f.get("name"),brand:f.get("brand"),reference:f.get("reference"),
      price:Number(f.get("price")),stock:Number(f.get("stock")),
      description:f.get("description"),image_url,published:f.get("published")==="on"
    });
    if(error) throw error;
    $("status").textContent="Success — product is now saved and will appear on the live store.";
    e.target.reset(); loadProducts();
  }catch(err){$("status").textContent="Error: "+err.message}
};
async function removeProduct(id){
  if(!confirm("Delete this product?")) return;
  const {error}=await client.from("products").delete().eq("id",id);
  if(error) alert(error.message); else loadProducts();
}
show();
</script>
</body></html>
